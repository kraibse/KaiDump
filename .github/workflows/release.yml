name: Build release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro

    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro packages
        run: |
          pkgs="switch-dev switch-sdl2 switch-sdl2_ttf switch-libjpeg-turbo"
          # pkg.devkitpro.org rejects CI downloads (HTTP 403); the
          # devkita64 image already ships these, so only sync if missing.
          if ! dkp-pacman -Q $pkgs; then
            dkp-pacman -Sy --needed --noconfirm $pkgs
          fi

      - name: Install ounce-devkit
        run: |
          curl -fsSL -o /tmp/ounce-install.sh \
            https://raw.githubusercontent.com/ouncebrew/ounce-devkit/main/install.sh
          sh /tmp/ounce-install.sh

      - name: Check tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^APP_VERSION *:= *//p' Makefile)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $version in Makefile"
            exit 1
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiDump
          path: KaiDump.nro
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KaiDump.nro
          generate_release_notes: true
